[versions]
agp = "8.9.0"
hiltAndroid = "2.57.1"
javaxInject = "1"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
lifecycleViewmodelKtx = "2.8.4"
